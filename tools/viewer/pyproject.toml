[project]
name = "blade-viewer"
version = "0.1.0"
description = "Simple window: video with boxes and a map with dots"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "websockets>=13", "numpy>=1.26", "opencv-python>=4.8"]

[project.scripts]
blade-viewer = "blade_viewer.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_viewer"
module-root = ""
