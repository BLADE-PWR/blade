name: arma_detector_v2_auto
version: 2
arch: yolo11n
imgsz: 1280                      # base input; auto_imgsz raises it for far scenes
auto_imgsz: {max: 1920, object_m: 7, min_px: 60}   # a 7 m vehicle at the aim point >= 60 px at the input (v2 training p1)
classes: [soldier_standing, soldier_kneeling, soldier_prone,
          tank, military_vehicle, explosion, tank_fire]
groups: {soldier: [0, 1, 2]}
events: [explosion, tank_fire]   # world-model treats these as events, not objects
conf: {detect: 0.25, track: 0.1}
nms_iou: 0.5
scale: {object_m: 1.8, min_px: 15}   # auto model choice: a 1.8 m soldier at the aim point >= 15 px at the input
                                     # (dataset_v2 train: standing soldier long side p2 = 15.5 px at 1536)
max_size_m: {soldier: 3, tank: 25, military_vehicle: 25}   # longer box side on the ground; dropped before tracking
preprocess: {enhance: false}
license: AGPL-3.0
# tracker.yaml: botsort_gmc_nt04.yaml
