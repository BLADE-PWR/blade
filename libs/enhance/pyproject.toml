[project]
name = "blade-enhance"
version = "0.1.0"
description = "Haze correction shared by the dataset builder and the detector"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pillow>=10"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_enhance"
module-root = ""
