[project]
name = "blade-common"
version = "0.1.0"
description = "Envelope, contracts, NATS helpers, timing, KLV"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "nats-py>=2.9", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_common"
module-root = ""
