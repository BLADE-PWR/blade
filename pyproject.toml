[project]
name = "blade"
version = "0.1.0"
description = "ZPI drone ISR: uplink, ingest, sessions, detector, georef, world model, gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "blade-common",
    "blade-geometry",
    "frame-code",
    "blade-enhance",
    "blade-uplink",
    "blade-ingest",
    "blade-sessions",
    "blade-detector",
    "blade-georef",
    "blade-world",
    "blade-terrain",
    "blade-gateway",
    "blade-evaluator",
    "blade-decision",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
blade-common = { workspace = true }
blade-geometry = { workspace = true }
frame-code = { workspace = true }
blade-enhance = { workspace = true }
blade-uplink = { workspace = true }
blade-ingest = { workspace = true }
blade-sessions = { workspace = true }
blade-detector = { workspace = true }
blade-georef = { workspace = true }
blade-world = { workspace = true }
blade-terrain = { workspace = true }
blade-gateway = { workspace = true }
blade-evaluator = { workspace = true }
blade-decision = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B905"]  # FastAPI defaults; zip(strict=) everywhere is noise

[tool.ruff.lint.isort]
known-first-party = ["blade_common", "blade_geometry", "frame_code", "blade_enhance", "blade_uplink", "blade_ingest", "blade_sessions", "blade_detector", "blade_georef", "blade_world", "blade_terrain", "blade_gateway", "blade_evaluator", "blade_decision"]
