# NATS for the blade pipeline. JetStream holds the spawn registry (KV bucket "registry").
port: 4222
http_port: 8222
max_payload: 8MB          # frames are ~100-300 KB JPEGs; raw TS chunks up to 512 KB
write_deadline: "5s"

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}
