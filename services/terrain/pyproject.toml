[project]
name = "blade-terrain"
version = "0.1.0"
description = "Map packages: meta, heights, crops"
requires-python = ">=3.12,<3.13"
dependencies = ["blade-common", "blade-geometry", "numpy>=1.26", "pillow>=10"]

[project.scripts]
blade-terrain = "blade_terrain.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_terrain"
module-root = ""
