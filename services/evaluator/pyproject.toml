[project]
name = "blade-evaluator"
version = "0.1.0"
description = "Live and offline localisation error against sim truth"
requires-python = ">=3.12,<3.13"
dependencies = ["blade-common", "numpy>=1.26"]

[project.scripts]
blade-evaluator = "blade_evaluator.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_evaluator"
module-root = ""
