[project]
name = "blade-sessions"
version = "0.1.0"
description = "Recording, import and replay of streams"
requires-python = ">=3.12,<3.13"
dependencies = ["blade-common", "blade-uplink", "av>=14", "httpx>=0.27", "numpy>=1.26", "pillow>=10", "python-multipart>=0.0.9"]

[project.scripts]
blade-sessions = "blade_sessions.main:main"
blade-import-stills = "blade_sessions.stills:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_sessions"
module-root = ""
