[project]
name = "blade-ingest"
version = "0.1.0"
description = "The server entry point for video: demux, decode, publish frames and sim truth"
requires-python = ">=3.12,<3.13"
dependencies = ["blade-common", "av>=14", "numpy>=1.26", "pillow>=10"]

[project.scripts]
blade-ingest = "blade_ingest.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_ingest"
module-root = ""
