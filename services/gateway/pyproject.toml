[project]
name = "blade-gateway"
version = "0.1.0"
description = "Sessions, admin API proxy, one WebSocket per session"
requires-python = ">=3.12,<3.13"
dependencies = ["blade-common", "httpx>=0.27", "numpy>=1.26", "pillow>=10"]

[project.scripts]
blade-gateway = "blade_gateway.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blade_gateway"
module-root = ""
